

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apna Bazaar</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f7f5;color:#222}
header{background:#008451;color:white;padding:24px 12px;text-align:center}
header h1{margin:0 0 10px}
input{padding:13px;width:85%;max-width:400px;border:0;border-radius:8px}
main{padding:16px}
h2{text-align:center}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:white;border-radius:12px;padding:15px;text-align:center;box-shadow:0 2px 8px #ddd}
.pic{font-size:55px}
button{background:#008451;color:white;border:0;padding:11px;border-radius:7px;width:100%;font-size:15px}
.price{font-weight:bold;color:#008451}
footer{text-align:center;padding:20px}
</style>
</head>
<body>
<header>
<h1>🛍️ Apna Bazaar</h1>
<p>आपकी अपनी ऑनलाइन दुकान</p>
<input id="search" placeholder="प्रोडक्ट खोजें..." oninput="findProducts()">
</header>
<main>
<h2>हमारे प्रोडक्ट</h2>
<div class="products" id="products">
<div class="card"><div class="pic">👕</div><h3>टी-शर्ट</h3><p class="price">₹299</p><button onclick="order('टी-शर्ट')">ऑर्डर करें</button></div>
<div class="card"><div class="pic">👟</div><h3>जूते</h3><p class="price">₹799</p><button onclick="order('जूते')">ऑर्डर करें</button></div>
<div class="card"><div class="pic">🎒</div><h3>बैग</h3><p class="price">₹499</p><button onclick="order('बैग')">ऑर्डर करें</button></div>
<div class="card"><div class="pic">⌚</div><h3>घड़ी</h3><p class="price">₹599</p><button onclick="order('घड़ी')">ऑर्डर करें</button></div>
</div>
</main>
<footer>© 2026 Apna Bazaar</footer>
<script>
function findProducts(){
let q=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.card').forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(q)?'block':'none';
});
}
function order(name){
alert('आपने '+name+' चुना है। ऑर्डर देने के लिए दुकान से संपर्क करें।');
}
</script>
</body>
</html>
